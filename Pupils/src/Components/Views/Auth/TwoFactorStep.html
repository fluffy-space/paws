<div>
    <h4 class="h5 mb-2">Two-factor sign-in</h4>
    <p if="{!$useRecovery}" class="text-muted">Enter the 6-digit code from your authenticator app.</p>
    <p if="$useRecovery" class="text-muted">Enter one of the recovery codes you saved when you turned on
        two-factor sign-in. Each code works once.</p>
    <form (submit)="submit" autocomplete="off">
        <input if="{!$useRecovery}" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="7"
            class="form-control form-control-lg text-center" placeholder="123456" aria-label="6-digit code"
            model="$model->Code" autofocus />
        <input if="$useRecovery" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
            class="form-control form-control-lg text-center" placeholder="xxxxx-xxxxx" aria-label="Recovery code"
            model="$model->Code" />
        <button type="submit" disabled="$loading" class="btn btn-primary mt-3 w-100">Continue</button>
    </form>
    <div if="{$error !== ''}" class="mt-3">
        <Alert variant="error" dismissible="{false}" body="$error" />
    </div>
    <div class="mt-3 small">
        <button if="{!$useRecovery}" type="button" class="btn btn-link p-0 text-secondary"
            (click)="toggleRecovery">Lost your phone? Use a recovery code</button>
        <button if="$useRecovery" type="button" class="btn btn-link p-0 text-secondary"
            (click)="toggleRecovery">Use the code from the app</button>
    </div>
</div>
