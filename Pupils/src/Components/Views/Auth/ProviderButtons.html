<div if="$any" class="provider-buttons">
    <form foreach="$buttons as $button" method="get" action="{$button['action']}" class="mb-2">
        <input if="{$redirect !== ''}" type="hidden" name="returnTo" value="$redirect" />
        <button type="submit" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2">
            <svg if="{$button['key'] === 'google'}" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"></path>
                <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"></path>
                <path fill="#FBBC05" d="M3.96 10.71A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z"></path>
                <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"></path>
            </svg>
            <svg if="{$button['key'] === 'microsoft'}" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                <path fill="#F25022" d="M0 0h8.5v8.5H0z"></path>
                <path fill="#7FBA00" d="M9.5 0H18v8.5H9.5z"></path>
                <path fill="#00A4EF" d="M0 9.5h8.5V18H0z"></path>
                <path fill="#FFB900" d="M9.5 9.5H18V18H9.5z"></path>
            </svg>
            <span>{t($button['label'])}</span>
        </button>
    </form>
    <div class="d-flex align-items-center gap-2 my-3 text-body-secondary small">
        <div class="flex-grow-1 border-top"></div>
        <div>{t('oauth.or')}</div>
        <div class="flex-grow-1 border-top"></div>
    </div>
</div>
