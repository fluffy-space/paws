
<div class="d-flex justify-content-between mt-2 mb-4 stack-sm">
    <div>
        <h3 if="$title" class="text-h3">$title</h3>
        <a class="icon-link" href="{$backHref ?? $backUrl}">
            <Icon name="bi-arrow-left" classList="icon" />
            Back
        </a>
    </div>
    <div class="text-right d-flex align-items-start gap-2">
        <slot name="actions"></slot>
        <button if="{$removable && !$createMode}" type="button" class="btn btn-outline-danger text-nowrap"
            (click)="confirmDelete">
            <Icon name="bi-trash" classList="icon" /> Delete
        </button>
        <ActionButton text="{$createMode ? 'Create' : 'Save'}" state="$state" (click)="onSave" />
    </div>
</div>
