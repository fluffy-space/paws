<EmailLayout title="{t('email.reset-password.title')}">
    <p>
        {t('email.activate.message', ['name' => $user->FirstName, 'surname' => $user->LastName])}
        <a href="{$baseUrl}/password/reset/$verificationCode">{t('email.reset-password.click-here')}</a>
    </p>
    <p style="margin:16px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#999999;word-break:break-all;">
        <a href="{$baseUrl}/password/reset/$verificationCode" style="color:#999999;">{$baseUrl}/password/reset/{$verificationCode}</a>
    </p>
</EmailLayout>
